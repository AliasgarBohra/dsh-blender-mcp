name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check the bundle is well formed
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dsh?.bundle?.patch) { console.error('missing dsh.bundle.patch'); process.exit(1); }
            const fs = require('fs');
            for (const f of pkg.files) {
              if (!fs.existsSync(f)) { console.error('declared file missing: ' + f); process.exit(1); }
            }
            console.log('bundle manifest ok');
          "

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
